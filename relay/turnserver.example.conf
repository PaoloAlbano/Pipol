# Example hardened coturn configuration for Pipol (self-hosted TURN, "coturn" provider of relay/ice.js).
#
# Credentials are short-lived: the relay mints them with the shared secret below (TURN REST API), so
# TURN_SECRET on the relay must equal static-auth-secret here. Never commit the real secret.
#
#   relay env:   TURN_PROVIDER=coturn
#                TURN_URLS=turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp,turns:turn.example.com:5349?transport=tcp
#                TURN_SECRET=<same value as static-auth-secret>
#                TURN_TTL=3600
#
# TURN credentials cannot be hidden from the browser and TURN does not see the web Origin, so this server is
# the second line of defence: it limits what someone holding valid credentials can do with it.

# --- Authentication: ephemeral credentials --------------------------------------------------------
use-auth-secret
static-auth-secret=<SECRET_SHARED_WITH_THE_RELAY>
realm=turn.example.com
fingerprint

# --- Network and TLS -------------------------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1
min-port=49152
max-port=65535
# external-ip=<PUBLIC_IP>/<PRIVATE_IP>      # when behind NAT (most cloud VMs)

# --- Never relay to internal networks (REQUIRED) ---------------------------------------------------
# A TURN server is a proxy: without these rules valid credentials can reach 127.0.0.1, the cloud
# metadata endpoint (169.254.169.254) and your private network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Quotas and bandwidth --------------------------------------------------------------------------
# The relay gives every /ice request its own username, so user-quota applies per issued credential.
user-quota=12            # simultaneous allocations per credential
total-quota=1200         # simultaneous allocations on the server
max-bps=3000000          # ~3 Mbit/s per session
# bps-capacity=0         # total capacity, 0 = unlimited

# --- Smaller attack surface ------------------------------------------------------------------------
no-cli
no-tcp-relay             # remove if you need TCP relaying towards peers
stale-nonce=600

# --- Observability ---------------------------------------------------------------------------------
prometheus
log-file=stdout
simple-log
