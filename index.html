<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pipol — serverless P2P group chat and video calls, no servers." />
    <meta name="theme-color" content="#7c6bf0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Pipol</title>
  </head>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: #7c6bf0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #splash-text {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #888;
      letter-spacing: 0.04em;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <body>
    <div id="splash">
      <img src="/icons/icon.svg" alt="Pipol" />
      <div id="splash-spinner"></div>
      <span id="splash-text">Loading…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
