<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f0f0f"/>
  <!-- Chat bubble -->
  <rect x="80" y="120" width="280" height="180" rx="32" fill="#7c6bf0"/>
  <polygon points="120,300 80,360 180,300" fill="#7c6bf0"/>
  <!-- P2P dots connected by lines -->
  <circle cx="360" cy="340" r="36" fill="#5eead4"/>
  <circle cx="440" cy="260" r="28" fill="#5eead4" opacity="0.7"/>
  <circle cx="420" cy="400" r="22" fill="#5eead4" opacity="0.5"/>
  <line x1="360" y1="340" x2="440" y2="260" stroke="#5eead4" stroke-width="4" opacity="0.6"/>
  <line x1="360" y1="340" x2="420" y2="400" stroke="#5eead4" stroke-width="4" opacity="0.6"/>
  <line x1="440" y1="260" x2="420" y2="400" stroke="#5eead4" stroke-width="3" opacity="0.4"/>
  <!-- Bubble dots -->
  <circle cx="160" cy="210" r="14" fill="white"/>
  <circle cx="220" cy="210" r="14" fill="white"/>
  <circle cx="280" cy="210" r="14" fill="white"/>
</svg>
