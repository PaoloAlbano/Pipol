# Main nginx configuration of the web image, tuned to hold a very large number of long-lived WebSocket
# connections (every chat client keeps one open to /signal). The server block is in default.conf.template.

worker_processes auto;

# File descriptors: a proxied WebSocket needs two connections (client and relay), so the limit must be at
# least twice worker_connections. The container must be started with a nofile ulimit that is not lower
# (docker-compose.yml sets it).
worker_rlimit_nofile 262144;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    # Per worker. With N workers the web container can hold about N * worker_connections / 2 WebSockets.
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The unprivileged image can only write under /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No access log: it would write one line per connection and name the visitors' addresses
    access_log off;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 10000;
    # Free the memory of connections that vanished instead of waiting for the TCP timeout
    reset_timedout_connection on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    include /etc/nginx/conf.d/*.conf;
}
