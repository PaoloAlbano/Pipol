# nginx of the web image: it only serves the built app (the browser talks to the relay and the auth server
# directly), so nothing here needs to be tuned for many connections. It sends no security headers: put them on
# the reverse proxy in front of it (see docs/docker.md).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The container runs as an unprivileged user: only /tmp is writable
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No access log: it would name the visitors' addresses
    access_log off;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    server {
        listen 8080;
        server_name _;

        root /app/dist;
        index index.html;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
