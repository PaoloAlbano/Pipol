name: E2E

# Browser tests with real Chromium, the relay and two peers. They run after a merge to main (and on demand),
# never on pull requests, so they cannot block a merge: a failure shows up as a red mark on the commit.
# Visual tests are left out (their snapshots are for macOS) and so are the coturn tests (they need Docker).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install relay dependencies
        run: npm ci
        working-directory: relay

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm exec playwright test --grep-invert Visual --reporter=list,html --trace=retain-on-failure
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
