name: Release

# Every merge to main that changes something for the users (a `feat:` or a `fix:` in the commit messages) makes a new
# version, by itself: the tag, the GitHub release with its notes, and the Docker images of that version.
# It starts when the CI workflow has finished on the merge, and only if it passed: a commit whose tests fail is not
# released. Nothing is written in the repository: the version is the tag. See docs/releasing.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Two merges close together are released one after the other: the second one starts from the tag of the first
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The tests of that commit passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      # The commit the tests ran on, not the latest one of main (a later merge may have arrived meanwhile)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # the history and the tags decide the version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Work out the version from the commits since the last tag
        id: next
        run: node scripts/next-version.mjs --github-output --notes release-notes.md

      - name: Tag and publish the release
        if: ${{ steps.next.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file release-notes.md

      # The branch that Cloudflare Pages builds for production: this commit, and a file with the version. One build per
      # release, and it already knows the version (a build from git does not know the tag). The branch is only ever
      # written here, by force: it is not a place to work. See docs/releasing.md.
      - name: Publish the release to the branch Cloudflare Pages deploys
        if: ${{ steps.next.outputs.release == 'true' }}
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$SHA"
          echo "$VERSION" > release-version.txt
          git add release-version.txt
          git commit -m "release $VERSION"
          git push --force origin HEAD:refs/heads/release

  images:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: pipol-web, context: . }
          - { image: pipol-relay, context: relay }
          - { image: pipol-auth, context: auth }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Tags of the image (1.2.3, 1.2 and latest)
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: echo "minor=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ steps.tags.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha }}
            APP_VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
